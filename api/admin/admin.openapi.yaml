      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
      parameters:
      - &id001
        name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
