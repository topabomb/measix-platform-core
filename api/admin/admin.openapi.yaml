        '404':
          $ref: '#/components/responses/Problem'
      parameters:
      - name: activationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ActivationId'
  /api/admin/v1/upstreams:
    get:
      operationId: listUpstreams
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamPage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
      parameters: &id009
      - *id004
      - *id005
    post:
      operationId: createUpstream
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upstream'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpstreamRequest'
      parameters:
      - *id001
  /api/admin/v1/upstreams/{upstreamId}:
    get:
      operationId: getUpstream
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upstream'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      parameters:
      - &id008
        name: upstreamId
        in: path
        required: true
