openapi: 3.0.3
info:
  title: MEASIX Admin API
  version: 1.0.0
paths:
  /api/admin/v1/session/login:
    post:
      operationId: login
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/admin/v1/session:
    get:
      operationId: getSession
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
        '401':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: logoutAdmin
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
      parameters:
      - &id001
        name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
  /api/admin/v1/users:
    get:
      operationId: listUsers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
      parameters:
      - &id004
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - &id005
        name: cursor
        in: query
        schema:
          type: string
      # Users are the one list an operator searches by name; without this the only
      # way to find an account is to page linearly through every user.
      - name: query
        in: query
        description: Case-insensitive match against username or display name. Omitted or empty returns every user.
        schema:
          type: string
          maxLength: 200
    post:
      operationId: createUser
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      parameters:
      - *id001
  /api/admin/v1/users/{userId}:
    get:
      operationId: getUser
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      parameters:
      - &id002
        name: userId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UserId'
    put:
      operationId: updateUser
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      parameters:
      - *id002
      - *id001
    delete:
      operationId: deleteUser
      responses:
        '202':
          description: Deletion accepted; runtime denial is applied before user-owned data is purged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activation'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUserRequest'
      parameters:
      - *id002
      - *id001
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/IdempotencyKey'
  /api/admin/v1/users/{userId}:disable:
    post:
      operationId: disableUser
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activation'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      parameters:
      - *id002
      - *id001
      - &id003
        name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/IdempotencyKey'
  /api/admin/v1/users/{userId}:enable:
    post:
      operationId: enableUser
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activation'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      parameters:
      - *id002
      - *id001
      - *id003
  /api/admin/v1/users/{userId}:set-password:
    post:
      operationId: setPassword
      responses:
        '204':
          description: Updated
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
      parameters:
      - *id002
      - *id001
  /api/admin/v1/users/{userId}/enrollments:
    post:
      operationId: createEnrollment
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEnrollmentResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentRequest'
      parameters:
      - *id002
      - *id001
  /api/admin/v1/users/{userId}/devices:
    get:
      operationId: listDevices
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      parameters:
      - *id002
      - *id004
      - *id005
  /api/admin/v1/users/{userId}/budgets:
    get:
      operationId: getUserBudgets
      responses:
        '200':
          description: Effective per-capability budget state for this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBudgetView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      parameters:
      - *id002
  /api/admin/v1/users/{userId}/budgets/{capability}:
    delete:
      operationId: clearUserBudgetOverride
      responses:
        '200':
          description: Effective budget after removing the user capability override.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetCapabilityView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      parameters:
      - *id002
      - name: capability
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/BudgetCapability'
      - name: expectedRevision
        in: query
        required: true
        schema:
          type: integer
          minimum: 0
      - name: reason
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 500
      - *id001
    put:
      operationId: putUserBudget
      responses:
        '200':
          description: Updated effective budget state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetCapabilityView'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutBudgetRequest'
      parameters:
      - *id002
      - name: capability
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/BudgetCapability'
      - *id001
  /api/admin/v1/users/{userId}/budget-template:
    put:
      operationId: assignUserBudgetTemplate
      responses:
        '200':
          description: Effective user budget after assigning or replacing the live template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBudgetView'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignBudgetTemplateRequest'
      parameters:
      - *id002
      - *id001
    delete:
      operationId: unassignUserBudgetTemplate
      responses:
        '200':
          description: Effective user budget after removing the live template assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBudgetView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      parameters:
      - *id002
      - name: expectedAssignmentRevision
        in: query
        required: true
        schema:
          type: integer
          minimum: 0
      - name: reason
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 500
      - *id001
  /api/admin/v1/budget-templates:
    get:
      operationId: listBudgetTemplates
      responses:
        '200':
          description: Budget templates ordered by name and stable id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetTemplatePage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
      parameters:
      - *id004
      - *id005
      - name: query
        in: query
        schema:
          type: string
    post:
      operationId: createBudgetTemplate
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetTemplate'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBudgetTemplateRequest'
      parameters:
      - *id001
  /api/admin/v1/budget-templates/{budgetTemplateId}:
    get:
      operationId: getBudgetTemplate
      responses:
        '200':
          description: Current template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetTemplate'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      parameters:
      - &budgetTemplateIdParam
        name: budgetTemplateId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/BudgetTemplateId'
    put:
      operationId: updateBudgetTemplate
      responses:
        '200':
          description: Updated template; uncovered assigned-user capabilities now use this revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetTemplate'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBudgetTemplateRequest'
      parameters:
      - *budgetTemplateIdParam
      - *id001
    delete:
      operationId: deleteBudgetTemplate
      responses:
        '204':
          description: Deleted. Assigned templates return conflict instead.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      parameters:
      - *budgetTemplateIdParam
      - name: expectedRevision
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      - name: reason
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 500
      - *id001
  /api/admin/v1/budget-templates/{budgetTemplateId}/users:
    get:
      operationId: listBudgetTemplateUsers
      responses:
        '200':
          description: Users currently assigned to this live template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      parameters:
      - *budgetTemplateIdParam
      - *id004
      - *id005
      - name: query
        in: query
        schema:
          type: string
  /api/admin/v1/budget-templates/{budgetTemplateId}/audit:
    get:
      operationId: listBudgetTemplateAudit
      responses:
        '200':
          description: Immutable template and assignment command history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetTemplateAuditPage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      parameters:
      - *budgetTemplateIdParam
      - *id004
      - *id005
  /api/admin/v1/users/{userId}/budgets/{capability}/audit:
    get:
      operationId: listUserBudgetAudit
      responses:
        '200':
          description: Immutable budget configuration and reconciliation audit history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetAuditPage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      parameters:
      - *id002
      - name: capability
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/BudgetCapability'
      - *id004
      - *id005
  /api/admin/v1/devices/{deviceId}:revoke:
    post:
      operationId: revokeDevice
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activation'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/DeviceId'
      - *id001
      - *id003
  /api/admin/v1/draft:
    get:
      operationId: getDraft
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    put:
      operationId: putDraft
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutDraftRequest'
      parameters:
      - *id001
  /api/admin/v1/draft:validate:
    post:
      operationId: validateDraft
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateDraftResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateDraftRequest'
      parameters:
      - *id001
  /api/admin/v1/draft:publish:
    post:
      operationId: publishDraft
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activation'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishDraftRequest'
      parameters:
      - *id001
      - *id003
  /api/admin/v1/draft:preview:
    post:
      operationId: previewDraft
      description: Compiles the current draft into a read-only snapshot preview without publishing. Returns the canonical projection hash and sorted resource arrays so the operator can review the exact shape that would be published. The projectionHash uses deterministic placeholder releaseId/generation/publishedAt, so repeated previews of the same saved draft are stable. It is NOT the final snapshotHash, which includes the real Release metadata.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftPreviewResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewDraftRequest'
      parameters:
      - *id001
  /api/admin/v1/releases:
    get:
      operationId: listReleases
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleasePage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
      # Anchor home for the plain limit/cursor pair reused by every other list.
      parameters: &id006
      - *id004
      - *id005
  /api/admin/v1/releases/{releaseId}:
    get:
      operationId: getRelease
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      parameters:
      - &id007
        name: releaseId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ReleaseId'
  /api/admin/v1/releases/{releaseId}:republish:
    post:
      operationId: republishRelease
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activation'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      parameters:
      - *id007
      - *id001
      - *id003
  /api/admin/v1/activations/{activationId}:
    get:
      operationId: getActivation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activation'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      parameters:
      - name: activationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ActivationId'
  /api/admin/v1/upstreams:
    get:
      operationId: listUpstreams
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamPage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
      parameters: &id009
      - *id004
      - *id005
      - name: query
        in: query
        description: Case-insensitive partial match on the human-readable upstream name.
        schema:
          type: string
    post:
      operationId: createUpstream
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upstream'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
