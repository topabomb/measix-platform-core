            $ref: '#/components/schemas/PricingRule'
    SystemStatus:
      type: object
      additionalProperties: false
      required:
      - buildVersion
      - dbHealth
      - migrationRevision
      - runtimeStatus
      - activeManagedGeneration
      - managedStateRevision
      - desiredControlRevision
      - relayReady
      properties:
        buildVersion:
          type: string
        dbHealth:
          type: string
        migrationRevision:
          type: string
        runtimeStatus:
          type: string
          enum:
          - READY
          - ACTIVATING
          - DEGRADED
        activeManagedGeneration:
          type: integer
          minimum: 0
        managedStateRevision:
          type: integer
          minimum: 0
        desiredControlRevision:
          type: integer
          minimum: 0
        desiredBundleHash:
          $ref: '#/components/schemas/Sha256Hash'
        relayReady:
          type: boolean
        appliedControlRevision:
          type: integer
          minimum: 0
        appliedBundleHash:
          $ref: '#/components/schemas/Sha256Hash'
        lastRelaySeenAt:
          type: string
          format: date-time
        latestActivation:
          $ref: '#/components/schemas/Activation'
        requestUsageIngestLagSeconds:
          type: integer
          minimum: 0
        semanticOrphanCount:
          type: integer
          minimum: 0
    Health:
      type: object
      additionalProperties: false
      required:
      - live
      - ready
      properties:
        live:
          type: boolean
        ready:
          type: boolean
  responses:
    Problem:
      description: Problem response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
