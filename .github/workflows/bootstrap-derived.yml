name: bootstrap-derived

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/s0-platform-core' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: agent/s0-platform-core
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: ariga/setup-atlas@v0
        with:
          version: 'v1.2.0'
      - name: 安装 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.0 --activate
      - name: 迁移内部 Go module namespace
        shell: bash
        run: |
          set -euo pipefail
          for old in 'github.com/topabomb/measix-platform-core/backend' 'measix-platform-core/backend'; do
            if grep -q "^module ${old}$" backend/go.mod; then
              sed -i "s#^module ${old}$#module measix/platform#" backend/go.mod
            fi
            grep -RIl --include='*.go' "$old" backend | while read -r file; do
              sed -i "s#${old}#measix/platform#g" "$file"
            done || true
          done
          find backend -name '*.go' -type f -print0 | xargs -0 gofmt -w
      - name: 生成派生产物
        run: make generate
      - name: 提交迁移与派生产物
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend console/pnpm-lock.yaml console/src/api/generated.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor: use host-independent Go module namespace"
          git push origin HEAD:agent/s0-platform-core
