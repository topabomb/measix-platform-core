name: red-platformid
on:
  push:
    branches: [agent/s0-platform-core]
  pull_request:
    branches: [main]
jobs:
  platformid-red:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
      - name: Run first S0 contract test
        run: go test ./pkg/platformid -run TestCanonicalKindsGenerateAndValidateUUIDv4 -count=1
