name: format-i2-once

on:
  push:
    branches: [agent/s0-platform-core]

permissions:
  contents: write

jobs:
  gofmt:
    if: ${{ !startsWith(github.event.head_commit.message, 'style: apply I2 gofmt') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/s0-platform-core
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Format I2 Go files
        run: gofmt -w backend/internal/hub/capability/service.go backend/internal/hub/capability/snapshot.go backend/internal/hub/capability/i2_component_test.go backend/internal/hub/upstream/service.go backend/internal/hub/security/secretbox.go backend/internal/hub/testutil/i2.go
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/hub/capability backend/internal/hub/upstream backend/internal/hub/security/secretbox.go backend/internal/hub/testutil/i2.go
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: apply I2 gofmt"
          git push origin HEAD:agent/s0-platform-core
