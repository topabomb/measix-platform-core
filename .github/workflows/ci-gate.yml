name: ci-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: ariga/setup-atlas@v0
        with:
          version: 'v1.2.0'
      - name: 安装 pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.0.0 --activate
      - name: 验证确定性生成链
        run: make generate
      - name: 执行 T0/T1/T2 聚合门禁
        run: make ci
