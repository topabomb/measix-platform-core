name: format-once

on:
  push:
    branches: [agent/s0-platform-core]

permissions:
  contents: write

jobs:
  gofmt:
    if: ${{ !startsWith(github.event.head_commit.message, 'style: apply gofmt') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/s0-platform-core
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Format Go
        run: gofmt -w $(find backend -name '*.go' -type f)
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply gofmt"
          git push origin HEAD:agent/s0-platform-core
