            - HTTP_STREAMING_SSE
            - HTTP_BINARY_STREAM
            - HTTP_MULTIPART
            - WEBSOCKET
        auth:
          $ref: '#/components/schemas/UpstreamAuth'
        correlationMode:
          type: string
          enum:
          - HEADER_ECHO
          - VIRTUAL_KEY
          - REQUEST_LOG_ID
          - USAGE_API
          - WEBHOOK
          - NONE
        usageCapabilityLevel:
          type: string
          enum:
          - LEVEL_0
          - LEVEL_1
          - LEVEL_2
        timeoutDefaults:
          $ref: '#/components/schemas/TimeoutPolicy'
    Upstream:
      type: object
      additionalProperties: false
      required:
      - upstreamId
      - name
      - configRevision
      - status
      properties:
        upstreamId:
          $ref: '#/components/schemas/UpstreamId'
        name:
          type: string
        configRevision:
          type: integer
          minimum: 1
        activeConfigRevision:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - INACTIVE
          - ACTIVE
          - APPLYING
          - DEGRADED
          - DISABLED
        config:
          $ref: '#/components/schemas/UpstreamConfig'
    CreateUpstreamRequest:
      type: object
      additionalProperties: false
      required:
      - config
      properties:
