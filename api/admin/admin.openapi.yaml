    PricingMeter:
      type: string
      enum:
      - INPUT_TOKENS
      - OUTPUT_TOKENS
      - CACHED_TOKENS
      - CHARACTERS
      - AUDIO_SECONDS
      - REQUESTS
      description: |
        Standard meters per architecture s0-control-protocol §13.
        MODEL  → INPUT_TOKENS + OUTPUT_TOKENS + CACHED_TOKENS + REQUESTS
        TTS    → CHARACTERS + AUDIO_SECONDS + REQUESTS
        ASR    → AUDIO_SECONDS + REQUESTS
        MCP    → REQUESTS
