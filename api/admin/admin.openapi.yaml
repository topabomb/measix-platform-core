        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEnterpriseUpdateRequest'
      parameters:
      - *id010
      - *id001
  /api/admin/v1/enterprise-updates/{enterpriseUpdateId}:publish:
    post:
      operationId: publishEnterpriseUpdate
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseUpdate'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      parameters:
      - *id010
      - *id001
  /api/admin/v1/enterprise-updates/{enterpriseUpdateId}:withdraw:
    post:
      operationId: withdrawEnterpriseUpdate
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseUpdate'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      parameters:
      - *id010
      - *id001
components:
  schemas:
    DeploymentId:
      type: string
      pattern: ^dep_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    UserId:
      type: string
      pattern: ^usr_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    DeviceId:
      type: string
      pattern: ^dev_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    EnrollmentId:
      type: string
      pattern: ^enr_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    SessionId:
      type: string
      pattern: ^ses_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    InstallationId:
      type: string
      pattern: ^ins_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    ProviderId:
      type: string
      pattern: ^prv_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    ModelId:
      type: string
      pattern: ^mdl_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    TtsId:
      type: string
      pattern: ^tts_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    AsrId:
      type: string
      pattern: ^asr_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    McpServerId:
      type: string
      pattern: ^mcp_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    PolicyId:
      type: string
      pattern: ^pol_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    DraftId:
      type: string
      pattern: ^drf_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    ReleaseId:
      type: string
      pattern: ^rel_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    UpstreamId:
      type: string
      pattern: ^ups_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    SecretId:
      type: string
      pattern: ^sec_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    RuntimeRouteId:
      type: string
      pattern: ^rte_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    ActivationId:
      type: string
      pattern: ^act_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    RequestId:
      type: string
      pattern: ^req_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    InteractionId:
      type: string
      pattern: ^int_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    PricingRuleId:
      type: string
      pattern: ^prc_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    IdempotencyKey:
      type: string
      pattern: ^idem_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    AssistantDefinitionId:
      type: string
      pattern: ^asd_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    StarterId:
      type: string
      pattern: ^str_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    EnterpriseUpdateId:
      type: string
      pattern: ^eup_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    Sha256Hash:
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        detail:
          type: string
        requestId:
          $ref: '#/components/schemas/RequestId'
        activationId:
          $ref: '#/components/schemas/ActivationId'
        targetManagedGeneration:
          type: integer
          minimum: 0
        currentDraftRevision:
          type: integer
          minimum: 0
        forwarded:
          type: boolean
    ValidationIssue:
      type: object
      additionalProperties: false
      required:
      - code
      - severity
      - path
      - message
      properties:
        code:
          type: string
        severity:
          type: string
          enum:
          - ERROR
          - WARNING
        path:
          type: string
        message:
          type: string
        resourceKind:
          type: string
          enum:
          - PROVIDER
          - MODEL
          - TTS
          - ASR
          - MCP
          - POLICY
          - BINDING
          - ASSISTANT
          - STARTER
        resourceId:
          type: string
        field:
          type: string
    ProviderDefinition:
      type: object
      additionalProperties: false
      required:
      - providerId
      - displayName
      - clientProtocol
      - enabled
      properties:
        providerId:
          $ref: '#/components/schemas/ProviderId'
        displayName:
          type: string
          minLength: 1
        clientProtocol:
          type: string
          enum:
          - OPENAI_CHAT_COMPLETIONS
        enabled:
          type: boolean
    ModelDefinition:
      type: object
      additionalProperties: false
      required:
      - modelId
      - providerId
      - displayName
      - upstreamModelKey
      - runtimePath
      - inputModalities
      - outputModalities
      - capabilities
      - enabled
      properties:
        modelId:
          $ref: '#/components/schemas/ModelId'
        providerId:
          $ref: '#/components/schemas/ProviderId'
        displayName:
          type: string
        upstreamModelKey:
          type: string
        runtimePath:
          type: string
          pattern: ^/[^?#]*$
        inputModalities:
          type: array
          items:
            type: string
            enum:
            - TEXT
            - IMAGE
        outputModalities:
          type: array
          items:
            type: string
            enum:
            - TEXT
        capabilities:
          type: array
          items:
            type: string
            enum:
            - TOOL
            - REASONING
        enabled:
          type: boolean
    TtsDefinition:
      type: object
      additionalProperties: false
      required:
      - ttsId
      - displayName
      - clientProtocol
      - upstreamModelKey
      - runtimePath
      - voice
      - enabled
      properties:
        ttsId:
          $ref: '#/components/schemas/TtsId'
        displayName:
          type: string
        clientProtocol:
          type: string
          enum:
          - OPENAI_AUDIO_SPEECH
        upstreamModelKey:
          type: string
          minLength: 1
        voice:
          type: string
          minLength: 1
        runtimePath:
          type: string
          pattern: ^/[^?#]*$
        enabled:
          type: boolean
    AsrDefinition:
      type: object
      additionalProperties: false
      required:
      - asrId
      - displayName
      - clientProtocol
      - upstreamModelKey
      - runtimePath
      - enabled
      properties:
        asrId:
          $ref: '#/components/schemas/AsrId'
        displayName:
          type: string
        clientProtocol:
          type: string
          enum:
          - OPENAI_AUDIO_TRANSCRIPTIONS
        upstreamModelKey:
          type: string
          minLength: 1
        language:
          type: string
        runtimePath:
          type: string
          pattern: ^/[^?#]*$
        enabled:
          type: boolean
    McpDefinition:
      type: object
      additionalProperties: false
      required:
      - mcpServerId
      - displayName
      - clientProtocol
      - runtimePath
      - authOwnership
      - enabled
      properties:
        mcpServerId:
          $ref: '#/components/schemas/McpServerId'
        displayName:
          type: string
        clientProtocol:
          type: string
          enum:
          - MCP_STREAMABLE_HTTP
        runtimePath:
          type: string
          pattern: ^/[^?#]*$
        authOwnership:
          type: string
          enum:
          - ENTERPRISE_MANAGED
          - NONE
        enabled:
          type: boolean
    TimeoutPolicy:
      type: object
      additionalProperties: false
      required:
      - connectMs
      - responseHeaderMs
      - idleMs
      properties:
        connectMs:
          type: integer
          minimum: 1
        responseHeaderMs:
          type: integer
          minimum: 1
        idleMs:
          type: integer
          minimum: 1
        overallMs:
          type: integer
          minimum: 1
    RuntimeBindingDefinition:
      type: object
      additionalProperties: false
      required:
      - runtimeRouteId
      - resourceId
      - upstreamId
      - allowedMethods
      - allowedPathPrefixes
      - transportPolicy
      properties:
        runtimeRouteId:
          $ref: '#/components/schemas/RuntimeRouteId'
        resourceId:
          type: string
        upstreamId:
          $ref: '#/components/schemas/UpstreamId'
        allowedMethods:
          type: array
          minItems: 1
          items:
            type: string
        allowedPathPrefixes:
          type: array
          minItems: 1
          items:
            type: string
            pattern: ^/
        transportPolicy:
          type: string
          enum:
          - HTTP_REQUEST_RESPONSE
          - HTTP_STREAMING_SSE
          - HTTP_BINARY_STREAM
          - HTTP_MULTIPART
        timeoutPolicy:
          $ref: '#/components/schemas/TimeoutPolicy'
    ManagedPolicy:
      type: object
      additionalProperties: false
      required:
      - policyId
      - allowLocalProviders
      - allowLocalTts
      - allowLocalAsr
      - allowLocalMcp
      properties:
        policyId:
          $ref: '#/components/schemas/PolicyId'
        allowLocalProviders:
          type: boolean
        allowLocalTts:
          type: boolean
        allowLocalAsr:
          type: boolean
        allowLocalMcp:
          type: boolean
        defaultModelId:
          $ref: '#/components/schemas/ModelId'
        defaultTtsId:
          $ref: '#/components/schemas/TtsId'
        defaultAsrId:
          $ref: '#/components/schemas/AsrId'
    ManagedDraftContent:
      type: object
      additionalProperties: false
      required:
      - providers
      - models
      - tts
      - asr
      - mcp
      - bindings
      - policy
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderDefinition'
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelDefinition'
        tts:
          type: array
          items:
            $ref: '#/components/schemas/TtsDefinition'
        asr:
          type: array
          items:
            $ref: '#/components/schemas/AsrDefinition'
        mcp:
          type: array
          items:
            $ref: '#/components/schemas/McpDefinition'
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeBindingDefinition'
        policy:
          $ref: '#/components/schemas/ManagedPolicy'
        assistants:
          type: array
          items:
            $ref: '#/components/schemas/ManagedAssistantDefinition'
        starters:
          type: array
          items:
            $ref: '#/components/schemas/AssistantStarterDefinition'
    ManagedAssistantDefinition:
      type: object
      additionalProperties: false
      required:
      - assistantDefinitionId
      - displayName
      - systemPrompt
      - modelId
      - memorySeed
      - mcpServerIds
      - enabled
      properties:
        assistantDefinitionId:
          $ref: '#/components/schemas/AssistantDefinitionId'
        displayName:
          type: string
          minLength: 1
        description:
          type: string
        systemPrompt:
          type: string
          minLength: 1
        modelId:
          $ref: '#/components/schemas/ModelId'
        memorySeed:
          type: array
          items:
            type: string
            minLength: 1
        mcpServerIds:
          type: array
          items:
            $ref: '#/components/schemas/McpServerId'
        enabled:
          type: boolean
    AssistantStarterDefinition:
      type: object
      additionalProperties: false
      required:
      - starterId
      - assistantDefinitionId
      - title
      - prompt
      - sortOrder
      - enabled
      properties:
        starterId:
          $ref: '#/components/schemas/StarterId'
        assistantDefinitionId:
          $ref: '#/components/schemas/AssistantDefinitionId'
        title:
          type: string
          minLength: 1
        prompt:
          type: string
          minLength: 1
        description:
          type: string
        sortOrder:
          type: integer
          minimum: 0
        enabled:
          type: boolean
    AdminUserSummary:
      type: object
      additionalProperties: false
      required:
      - userId
      - displayName
      - role
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        displayName:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - MEMBER
    AdminSession:
      type: object
      additionalProperties: false
      required:
      - user
      - csrfToken
      - expiresAt
      properties:
        user:
          $ref: '#/components/schemas/AdminUserSummary'
        csrfToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          minLength: 12
          maxLength: 128
    User:
      type: object
      additionalProperties: false
      required:
      - userId
      - username
      - displayName
      - role
      - status
      - createdAt
      - updatedAt
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - MEMBER
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - displayName
      - role
      properties:
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - MEMBER
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - displayName
      - role
      properties:
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - MEMBER
    SetPasswordRequest:
      type: object
      additionalProperties: false
      required:
      - newPassword
      properties:
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
    CreateEnrollmentRequest:
      type: object
      additionalProperties: false
      properties:
        expiresInSeconds:
          type: integer
          minimum: 60
          maximum: 3600
          default: 600
    CreateEnrollmentResponse:
      type: object
      additionalProperties: false
      required:
      - enrollmentId
      - code
      - expiresAt
      properties:
        enrollmentId:
          $ref: '#/components/schemas/EnrollmentId'
        code:
          type: string
        expiresAt:
          type: string
          format: date-time
    Device:
      type: object
      additionalProperties: false
      required:
      - deviceId
      - userId
      - status
      properties:
        deviceId:
          $ref: '#/components/schemas/DeviceId'
        userId:
          $ref: '#/components/schemas/UserId'
        installationId:
          $ref: '#/components/schemas/InstallationId'
        status:
          type: string
          enum:
          - ACTIVE
          - REVOKED
        appVersion:
          type: string
        lastSeenAt:
          type: string
          format: date-time
    UserPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        nextCursor:
          type: string
    DevicePage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        nextCursor:
          type: string
    UpstreamPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Upstream'
        nextCursor:
          type: string
    Activation:
      type: object
      additionalProperties: false
      required:
      - activationId
      - kind
      - state
      - desiredControlRevision
      - createdAt
      - updatedAt
      properties:
        activationId:
          $ref: '#/components/schemas/ActivationId'
        kind:
          type: string
          enum:
          - PUBLISH
          - RUNTIME_CONFIG
          - SECURITY_CHANGE
        state:
          type: string
          enum:
          - APPLYING
          - COMPLETED
          - FAILED
          - UNKNOWN
        releaseId:
          $ref: '#/components/schemas/ReleaseId'
        subjectId:
          type: string
        targetManagedGeneration:
          type: integer
          minimum: 0
        desiredControlRevision:
          type: integer
          minimum: 0
        bundleHash:
          $ref: '#/components/schemas/Sha256Hash'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        errorCode:
          type: string
    SecretRef:
      type: object
      additionalProperties: false
      required:
      - secretId
      - secretVersion
      properties:
        secretId:
          $ref: '#/components/schemas/SecretId'
        secretVersion:
          type: integer
          minimum: 1
    UpstreamAuth:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - NONE
          - BEARER
          - STATIC_HEADER
          - BASIC
        secretRef:
          $ref: '#/components/schemas/SecretRef'
        headerName:
          type: string
        username:
          type: string
        passwordSecretRef:
          $ref: '#/components/schemas/SecretRef'
    UpstreamConfig:
      type: object
      additionalProperties: false
      required:
      - name
      - baseUrl
      - transportCapabilities
      - auth
      - correlationMode
      - usageCapabilityLevel
      - timeoutDefaults
      properties:
        name:
          type: string
        baseUrl:
          type: string
          format: uri
        transportCapabilities:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - HTTP_REQUEST_RESPONSE
            - HTTP_STREAMING_SSE
            - HTTP_BINARY_STREAM
            - HTTP_MULTIPART
        auth:
          $ref: '#/components/schemas/UpstreamAuth'
        correlationMode:
          type: string
          enum:
          - HEADER_ECHO
          - VIRTUAL_KEY
          - REQUEST_LOG_ID
          - USAGE_API
          - WEBHOOK
          - NONE
        usageCapabilityLevel:
          type: string
          enum:
          - LEVEL_0
          - LEVEL_1
          - LEVEL_2
        timeoutDefaults:
          $ref: '#/components/schemas/TimeoutPolicy'
    Upstream:
      type: object
      additionalProperties: false
      required:
      - upstreamId
      - name
      - configRevision
      - status
      properties:
        upstreamId:
          $ref: '#/components/schemas/UpstreamId'
        name:
          type: string
        configRevision:
          type: integer
          minimum: 1
        activeConfigRevision:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - INACTIVE
          - ACTIVE
          - APPLYING
          - DEGRADED
          - DISABLED
        config:
          $ref: '#/components/schemas/UpstreamConfig'
    CreateUpstreamRequest:
      type: object
      additionalProperties: false
      required:
      - config
      properties:
        config:
          $ref: '#/components/schemas/UpstreamConfig'
    UpdateUpstreamRequest:
      type: object
      additionalProperties: false
      required:
      - expectedConfigRevision
      - config
      properties:
        expectedConfigRevision:
          type: integer
          minimum: 1
        config:
          $ref: '#/components/schemas/UpstreamConfig'
    UpstreamTestResult:
      type: object
      additionalProperties: false
      required:
      - reachable
      - verifiedCapabilities
      - warnings
      properties:
        reachable:
          type: boolean
        latencyMs:
          type: integer
          minimum: 0
        verifiedCapabilities:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
    Secret:
      type: object
      additionalProperties: false
      required:
      - secretId
      - name
      - secretVersion
      properties:
        secretId:
          $ref: '#/components/schemas/SecretId'
        name:
          type: string
        secretVersion:
          type: integer
          minimum: 1
    CreateSecretRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - value
      properties:
        name:
          type: string
        value:
          type: string
          minLength: 1
    ReplaceSecretRequest:
