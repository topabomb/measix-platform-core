name: module-namespace-once

on:
  push:
    branches: [agent/s0-platform-core]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/s0-platform-core
          fetch-depth: 0
      - name: 迁移项目内部 Go module namespace
        shell: bash
        run: |
          set -euo pipefail
          old='github.com/topabomb/measix-platform-core/backend'
          new='measix/platform'
          sed -i "s#^module ${old}$#module ${new}#" backend/go.mod
          grep -RIl --include='*.go' "$old" backend | while read -r file; do
            sed -i "s#${old}#${new}#g" "$file"
          done
          find backend -name '*.go' -type f -print0 | xargs -0 gofmt -w
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend
          git commit -m 'refactor: decouple Go namespace from repository hosting'
          git push origin HEAD:agent/s0-platform-core
