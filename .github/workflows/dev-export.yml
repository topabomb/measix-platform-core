name: dev-export

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  GO_VERSION: '1.26.5'
  NODE_VERSION: '24'
  PNPM_VERSION: '11.0.0'

jobs:
  export:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: 设置 Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: 固定 pnpm 版本
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - uses: ariga/setup-atlas@v0
        with:
          version: 'v1.2.0'

      - name: 在 CI 固定工具链下重新生成
        run: make generate

      - name: 同步确定性生成物到当前 PR 分支
        run: |
          if git diff --quiet -- backend/go.mod backend/go.sum backend/ent backend/internal/wire backend/migrations/atlas.sum console/pnpm-lock.yaml console/src/api/generated.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/go.mod backend/go.sum backend/ent backend/internal/wire backend/migrations/atlas.sum console/pnpm-lock.yaml console/src/api/generated.ts
          git commit -m "同步确定性生成物"
          git push origin HEAD:${{ github.head_ref }}

      - name: 打包当前已跟踪源码
        run: |
          git ls-files -z | xargs -0 zip -q /tmp/measix-platform-core-source.zip

      - uses: actions/upload-artifact@v4
        with:
          name: measix-platform-core-source
          path: /tmp/measix-platform-core-source.zip
          if-no-files-found: error
          retention-days: 1
