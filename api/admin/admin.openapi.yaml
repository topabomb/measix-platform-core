          type: string
          enum: [STANDARD, CUSTOM, UNAVAILABLE]
          description: Effective deployment-selected Portal document source. This is operational configuration, not Managed Snapshot content.
        portalUrl:
          type: string
          format: uri
          description: Device-facing Core /portal/ URL when Portal is available.
        portalUpstreamUrl:
          type: string
          format: uri
          description: Deployment-owned custom static Portal base URL proxied by Core; present only in CUSTOM mode.
        relayBuildVersion:
          type: string
          minLength: 1
          description: Running Relay build identity from a successful private status read. Omitted when unavailable; never copied from Hub.
        buildVersion:
          type: string
        dbHealth:
          type: string
        schemaIdentity:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        runtimeStatus:
          type: string
          enum:
          - READY
          - ACTIVATING
          - DEGRADED
        activeManagedGeneration:
          type: integer
          minimum: 0
        managedStateRevision:
          type: integer
          minimum: 0
        desiredControlRevision:
          type: integer
          minimum: 0
        desiredBundleHash:
          $ref: '#/components/schemas/Sha256Hash'
        relayReady:
          type: boolean
        appliedControlRevision:
          type: integer
          minimum: 0
        appliedBundleHash:
          $ref: '#/components/schemas/Sha256Hash'
        lastRelaySeenAt:
          type: string
          format: date-time
        currentActivation:
          $ref: '#/components/schemas/Activation'
        lastActivation:
          $ref: '#/components/schemas/Activation'
        spoolState:
          type: string
          enum: [OK, METERING_DEGRADED]
          description: Omitted when Relay spool status is unavailable; omission does not mean OK.
        spoolPendingCount:
          type: integer
          minimum: 0
        oldestPendingAgeSeconds:
          type: integer
          minimum: 0
        requestUsageIngestLagSeconds:
          type: integer
          minimum: 0
        semanticOrphanCount:
          type: integer
          minimum: 0
        semanticUnknownRequestCount:
          type: integer
          minimum: 0
          description: Number of retained requests with no linked semantic records or at least one UNKNOWN record. Counts requests once, excludes unlinked provider records, and uses the same completeness rule as Usage. Omission means unavailable, not zero.
    DeploymentSettings:
      type: object
      additionalProperties: false
      required: [deploymentId, name, timezone, publicOrigin, updatedAt]
      properties:
        deploymentId:
          $ref: '#/components/schemas/DeploymentId'
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Human-facing enterprise name shown to enrolled users and Portal sessions.
        timezone:
          type: string
          minLength: 1
          description: Fixed deployment IANA timezone. Changing it at runtime would alter natural budget periods and is intentionally not mutable in this API.
        publicOrigin:
          type: string
          format: uri
          minLength: 1
          maxLength: 1024
          description: Canonical external HTTP or HTTPS enterprise address advertised to clients. It may be changed at runtime without changing Deployment, User, Device or Android Session identity. Changing it revokes only existing Portal browser sessions and does not configure DNS, TLS or ingress.
        updatedAt:
          type: string
          format: date-time
    UpdateDeploymentSettingsRequest:
      type: object
      additionalProperties: false
      required: [expectedUpdatedAt, name, publicOrigin]
      properties:
        expectedUpdatedAt:
          type: string
          format: date-time
        name:
          type: string
          minLength: 1
          maxLength: 120
        publicOrigin:
          type: string
          format: uri
          minLength: 1
          maxLength: 1024
          description: Operator-supplied HTTP or HTTPS enterprise address. Core canonicalizes it before comparison and persistence; a value equivalent to the current canonical origin is a no-op.
    Health:
      type: object
      additionalProperties: false
      required:
      - live
      - ready
      properties:
        live:
          type: boolean
        ready:
          type: boolean
    EnterpriseUpdateStatus:
      type: string
      enum:
      - DRAFT
      - PUBLISHED
      - WITHDRAWN
    EnterpriseUpdateCategory:
      type: string
      enum:
      - ANNOUNCEMENT
      - MAINTENANCE
      - NOTICE
    EnterpriseUpdateSeverity:
      type: string
      enum:
      - INFO
      - WARNING
      - CRITICAL
    EnterpriseUpdateContentFormat:
      type: string
      enum:
      - MARKDOWN
      - PLAIN
    EnterpriseUpdate:
      type: object
      additionalProperties: false
      required:
      - enterpriseUpdateId
      - title
      - content
      - contentFormat
      - category
      - severity
      - status
      - feedRevision
      - createdAt
      - updatedAt
      properties:
        enterpriseUpdateId:
          $ref: '#/components/schemas/EnterpriseUpdateId'
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        contentFormat:
          $ref: '#/components/schemas/EnterpriseUpdateContentFormat'
        category:
          $ref: '#/components/schemas/EnterpriseUpdateCategory'
        severity:
          $ref: '#/components/schemas/EnterpriseUpdateSeverity'
        status:
          $ref: '#/components/schemas/EnterpriseUpdateStatus'
        publishedAt:
          type: string
          format: date-time
          nullable: true
        feedRevision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EnterpriseUpdatePage:
      type: object
      additionalProperties: false
      required:
      - items
      - feedRevision
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EnterpriseUpdate'
        feedRevision:
          type: integer
          minimum: 1
        nextCursor:
          type: string
    CreateEnterpriseUpdateRequest:
      type: object
      additionalProperties: false
      required:
      - title
      - content
      - contentFormat
      - category
      - severity
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        contentFormat:
          $ref: '#/components/schemas/EnterpriseUpdateContentFormat'
        category:
          $ref: '#/components/schemas/EnterpriseUpdateCategory'
        severity:
          $ref: '#/components/schemas/EnterpriseUpdateSeverity'
    UpdateEnterpriseUpdateRequest:
      type: object
      additionalProperties: false
      required:
      - title
      - content
      - contentFormat
      - category
      - severity
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        contentFormat:
          $ref: '#/components/schemas/EnterpriseUpdateContentFormat'
        category:
          $ref: '#/components/schemas/EnterpriseUpdateCategory'
        severity:
          $ref: '#/components/schemas/EnterpriseUpdateSeverity'
  responses:
    Problem:
      description: Problem response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
