name: bootstrap-derived

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/s0-platform-core' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: agent/s0-platform-core
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: ariga/setup-atlas@v0
        with:
          version: 'v1.2.0'
      - name: 安装 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.0 --activate
      - name: 生成派生产物
        run: make generate
      - name: 提交派生产物
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/go.mod backend/go.sum backend/ent backend/internal/wire backend/migrations/atlas.sum console/pnpm-lock.yaml console/src/api/generated.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: regenerate derived artifacts"
          git push origin HEAD:agent/s0-platform-core
