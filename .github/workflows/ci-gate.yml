name: ci-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.5'
  NODE_VERSION: '24'
  PNPM_VERSION: '11.0.0'

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: 恢复 Go dependency/build cache
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: 固定 pnpm 版本
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: 恢复 pnpm store cache
        id: pnpm-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('console/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - uses: ariga/setup-atlas@v0
        with:
          version: 'v1.2.0'

      - name: 验证确定性生成链
        id: generate
        run: make generate

      - name: 保存 Go cache
        if: ${{ steps.generate.outcome == 'success' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('backend/go.sum') }}

      - name: 保存 pnpm store cache
        if: ${{ steps.generate.outcome == 'success' && steps.pnpm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('console/pnpm-lock.yaml') }}

      - name: 执行 T0 静态与契约门禁
        run: make fmt-check contract migrations generated-drift

  test:
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: 恢复 Go dependency/build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: 固定 pnpm 版本
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: 恢复 pnpm store cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('console/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: 执行 T1/T2 行为与组件门禁
        run: make backend-test console-test

  ci-gate:
    if: ${{ always() }}
    needs: [static-contract, test]
    runs-on: ubuntu-24.04
    steps:
      - name: 汇总 required gate
        run: |
          test "${{ needs.static-contract.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
