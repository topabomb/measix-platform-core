name: Apply Upstream List Green

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/apply-upstream-list.yml

permissions:
  contents: write

env:
  GO_VERSION: '1.26.5'
  NODE_VERSION: '24'
  PNPM_VERSION: '11.0.0'
  CLEAN_BASE: '7e074bb9866ab5e5703879751275b4e8698234d3'

jobs:
  product-only:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Preserve verified source patch and reset to clean product base
        run: |
          cp .github/patches/apply-upstream-list.patch /tmp/apply-upstream-list.patch
          git checkout ${CLEAN_BASE}
          git apply /tmp/apply-upstream-list.patch
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - uses: ariga/setup-atlas@v0
        with:
          version: v1.2.0
      - name: Run canonical generators and focused Green
        run: |
          make generate
          cd backend
          go test ./internal/contract ./internal/hub/upstream -count=1
          cd ../console
          pnpm test --run
      - name: Commit and push product-only branch
        run: |
          git config user.name 'measix-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add api backend console
          git diff --cached --check
          git commit -m 'feat: 补齐 Admin Upstream 分页列表契约'
          git push --force origin HEAD:refs/heads/agent/s0-upstream-list-generated
