  /api/admin/v1/usage/summary:
    get:
      operationId: usageSummary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
      parameters: &usageFilters
      - &uf_from
        name: from
        in: query
        schema:
          type: string
          format: date-time
      - &uf_to
        name: to
        in: query
        schema:
          type: string
          format: date-time
      - &uf_userId
        name: userId
        in: query
        schema:
          type: string
      - &uf_resourceId
        name: resourceId
        in: query
        schema:
          type: string
      - &uf_resourceKind
        name: resourceKind
        in: query
        schema:
          type: string
          enum:
          - PROVIDER
          - MODEL
          - TTS
          - ASR
          - MCP
      - &uf_upstreamId
        name: upstreamId
        in: query
        schema:
          type: string
      - &uf_status
        name: status
        in: query
        schema:
          type: string
          enum:
          - SUCCESS
          - ERROR
          - BLOCKED
      - &uf_completeness
        name: completeness
        in: query
        schema:
          type: string
          enum:
          - EXACT
          - PARTIAL
          - UNKNOWN
  /api/admin/v1/usage/requests:
    get:
      operationId: listUsageRequests
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
