    PricingMeter:
      type: string
      enum:
      - INPUT_TOKENS
      - OUTPUT_TOKENS
      - CACHED_TOKENS
      - TOTAL_TOKENS
      - CHARACTERS
      - AUDIO_SECONDS
      - REQUESTS
      - REQUESTED_IMAGES
      description: |
        Standard meters per the S0.2 production usage and user budget contract.
        MODEL  → INPUT_TOKENS + OUTPUT_TOKENS + CACHED_TOKENS + TOTAL_TOKENS + REQUESTS
        TTS    → CHARACTERS + AUDIO_SECONDS + REQUESTS
        ASR    → AUDIO_SECONDS + REQUESTS
        MCP    → REQUESTS
        IMAGE_GENERATION → REQUESTS + REQUESTED_IMAGES
