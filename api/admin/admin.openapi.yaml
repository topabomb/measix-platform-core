          $ref: '#/components/schemas/UpstreamConfig'
    UpstreamTestResult:
      type: object
      additionalProperties: false
      required:
      - reachable
      - warnings
      properties:
        reachable:
          type: boolean
          description: A response was received by an unauthenticated HEAD probe of the saved candidate base URL. Does not verify authentication or capability support.
        latencyMs:
          type: integer
          minimum: 0
        httpStatus:
          type: integer
          minimum: 100
          maximum: 599
          description: Observed HTTP response status; omitted when no response was received.
        warnings:
          type: array
          items:
            type: string
    Secret:
      type: object
      additionalProperties: false
      required:
      - secretId
      - name
      - secretVersion
      properties:
        secretId:
          $ref: '#/components/schemas/SecretId'
        name:
          type: string
        secretVersion:
          type: integer
          minimum: 1
    SecretPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Secret'
        nextCursor:
          type: string
    CreateSecretRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - value
      properties:
        name:
          type: string
        value:
          type: string
          minLength: 1
    ReplaceSecretRequest:
      type: object
      additionalProperties: false
      required:
      - expectedSecretVersion
      - value
      properties:
        expectedSecretVersion:
          type: integer
          minimum: 1
        value:
          type: string
          minLength: 1
    Draft:
      type: object
      additionalProperties: false
      required:
      - draftId
      - draftRevision
      - content
      properties:
        draftId:
          $ref: '#/components/schemas/DraftId'
        draftRevision:
          type: integer
          minimum: 0
        content:
          $ref: '#/components/schemas/ManagedDraftContent'
    PutDraftRequest:
      type: object
      additionalProperties: false
      required:
      - expectedDraftRevision
      - content
      properties:
        expectedDraftRevision:
          type: integer
          minimum: 0
        content:
          $ref: '#/components/schemas/ManagedDraftContent'
    ValidateDraftRequest:
      type: object
      additionalProperties: false
      required:
      - expectedDraftRevision
      properties:
        expectedDraftRevision:
          type: integer
          minimum: 0
    ValidateDraftResponse:
      type: object
      additionalProperties: false
      required:
      - valid
      - errors
      - warnings
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
    PublishDraftRequest:
      type: object
      additionalProperties: false
      required:
      - expectedDraftRevision
      - acknowledgedWarningCodes
      properties:
        expectedDraftRevision:
          type: integer
          minimum: 0
        acknowledgedWarningCodes:
          type: array
          items:
            type: string
    PreviewDraftRequest:
      type: object
      additionalProperties: false
      required:
      - expectedDraftRevision
      properties:
        expectedDraftRevision:
          type: integer
          minimum: 0
    DraftPreviewResponse:
      type: object
      additionalProperties: false
      required:
      - draftRevision
      - projectionHash
      - providers
      - models
      - tts
      - asr
      - mcp
      - policy
      - assistants
      - starters
      - diffSummary
      properties:
        draftRevision:
          type: integer
          minimum: 0
        projectionHash:
          $ref: '#/components/schemas/Sha256Hash'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderDefinition'
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelDefinition'
        tts:
          type: array
          items:
            $ref: '#/components/schemas/TtsDefinition'
        asr:
          type: array
          items:
            $ref: '#/components/schemas/AsrDefinition'
        mcp:
          type: array
          items:
            $ref: '#/components/schemas/McpDefinition'
        policy:
          $ref: '#/components/schemas/ManagedPolicy'
        assistants:
          type: array
          items:
            $ref: '#/components/schemas/ManagedAssistantDefinition'
        starters:
          type: array
          items:
            $ref: '#/components/schemas/AssistantStarterDefinition'
        publishedGeneration:
          type: integer
          minimum: 1
          description: Latest immutable release generation used as the comparison baseline. Absent when no release exists.
        diffSummary:
          $ref: '#/components/schemas/DiffSummary'
    ReleaseDiffKind:
      type: string
      enum:
      - PROVIDER
      - MODEL
      - TTS
      - ASR
      - MCP
      - POLICY
      - ASSISTANT
      - STARTER
      - BINDING
    ResourceDiff:
      type: object
      additionalProperties: false
      required:
      - kind
      - added
      - changed
      - removed
      properties:
        kind:
          $ref: '#/components/schemas/ReleaseDiffKind'
        added:
          type: integer
          minimum: 0
        changed:
          type: integer
          minimum: 0
        removed:
          type: integer
          minimum: 0
    DiffSummary:
      type: object
      additionalProperties: false
      required:
      - added
      - changed
      - removed
      properties:
        added:
          type: integer
          minimum: 0
        changed:
          type: integer
          minimum: 0
        removed:
          type: integer
          minimum: 0
        details:
          type: array
          items:
            $ref: '#/components/schemas/ResourceDiff'
    ActivationSummary:
      type: object
      additionalProperties: false
      required:
      - activationId
      - state
      - createdAt
      properties:
        activationId:
          $ref: '#/components/schemas/ActivationId'
        state:
          type: string
          enum:
          - APPLYING
          - COMPLETED
          - FAILED
          - UNKNOWN
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        errorCode:
          type: string
    Release:
      type: object
      additionalProperties: false
      required:
      - releaseId
      - managedGeneration
      - status
      - snapshotHash
      - createdAt
      - sourceDraftRevision
      - publishedAt
      - publishedBy
      - diffSummary
      - activationHistory
      properties:
        releaseId:
          $ref: '#/components/schemas/ReleaseId'
        managedGeneration:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - STAGED
          - ACTIVE
          - ACTIVATION_FAILED
          - SUPERSEDED
        snapshotHash:
          $ref: '#/components/schemas/Sha256Hash'
        createdAt:
          type: string
          format: date-time
        sourceDraftRevision:
          type: integer
          minimum: 0
        publishedAt:
          type: string
          format: date-time
        publishedBy:
          type: string
        diffSummary:
          $ref: '#/components/schemas/DiffSummary'
        activationHistory:
                    type: array
                    description: Most recent activation attempts for this release, newest first. Bounded, because one release can be republished repeatedly and this array is returned with every release in the list.
                    maxItems: 20
                    items:
                      $ref: '#/components/schemas/ActivationSummary'
    ReleasePage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Release'
        nextCursor:
          type: string
    UsageSummary:
      type: object
      additionalProperties: false
      required:
      - from
      - to
      - requestCount
      - forwardedRequestCount
      - requestCompleteness
      - requestBytes
      - responseBytes
      - semanticMeters
      - cost
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        requestCount:
          type: integer
          minimum: 0
        forwardedRequestCount:
          type: integer
          minimum: 0
        requestCompleteness:
          $ref: '#/components/schemas/RequestCompletenessCounts'
        requestBytes:
          type: integer
          minimum: 0
        responseBytes:
          type: integer
          minimum: 0
        semanticMeters:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - meter
            - quantity
            - confidence
            properties:
              meter:
                $ref: '#/components/schemas/PricingMeter'
              quantity:
                type: string
              confidence:
                type: string
                enum:
                - EXACT
                - PARTIAL
                - UNKNOWN
        cost:
          type: object
          additionalProperties: false
          required:
          - status
          properties:
            status:
              type: string
              enum:
              - KNOWN
              - PARTIAL
              - UNKNOWN
            amount:
              type: string
            currency:
              type: string
    RequestCompletenessCounts:
      type: object
      additionalProperties: false
      required: [exact, partial, unknown]
      description: Counts of whole requests within the same summary filter; sum equals requestCount.
      properties:
        exact:
          type: integer
          minimum: 0
        partial:
          type: integer
          minimum: 0
        unknown:
          type: integer
          minimum: 0
    RequestUsageView:
      type: object
      additionalProperties: false
      required:
      - requestId
      - deploymentId
      - userId
      - managedGeneration
      - controlRevision
      - startedAt
      - completedAt
      - forwarded
      - httpStatus
      - requestBytes
      - responseBytes
      - durationMs
      - userDisplayName
      properties:
        requestId:
          $ref: '#/components/schemas/RequestId'
        interactionId:
          $ref: '#/components/schemas/InteractionId'
        deploymentId:
          $ref: '#/components/schemas/DeploymentId'
        userId:
          $ref: '#/components/schemas/UserId'
        deviceId:
          $ref: '#/components/schemas/DeviceId'
        resourceId:
          x-go-type-skip-optional-pointer: true
          type: string
        resourceDisplayName:
          type: string
          x-go-type-skip-optional-pointer: true
          description: Resource name from the immutable snapshot for this request's managedGeneration; omitted when not found.
        # An audit row must identify whose request it is without a second lookup,
        # so the display names travel with the row. Both are display metadata and
        # carry no authority. user_id is NOT NULL with a foreign key, so the user
        # name always resolves; device_id is nullable, so a request that carries
        # no device carries no device name.
        userDisplayName:
          type: string
          description: Display name resolved from the users table. Always present, because a usage row cannot exist without its user. Display metadata, not authorization identity.
        deviceName:
          type: string
          x-go-type-skip-optional-pointer: true
          description: Device name reported at enrollment; empty when the request carries no device. Display metadata, not authorization identity.
        runtimeRouteId:
          x-go-type-skip-optional-pointer: true
          $ref: '#/components/schemas/RuntimeRouteId'
        upstreamId:
          x-go-type-skip-optional-pointer: true
          $ref: '#/components/schemas/UpstreamId'
        managedGeneration:
          type: integer
          minimum: 0
        controlRevision:
          type: integer
          minimum: 0
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        forwarded:
          type: boolean
        httpStatus:
          type: integer
        upstreamHttpStatus:
          type: integer
        requestBytes:
          type: integer
          minimum: 0
        responseBytes:
          type: integer
          minimum: 0
        durationMs:
          type: integer
          minimum: 0
        errorClass:
          type: string
    RequestUsagePage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RequestUsageView'
        nextCursor:
          type: string
    PricingMeter:
      type: string
      enum:
      - INPUT_TOKENS
      - OUTPUT_TOKENS
      - CACHED_TOKENS
      - CHARACTERS
      - AUDIO_SECONDS
      - REQUESTS
      description: |
        Standard meters per architecture s0-control-protocol §13.
        MODEL  → INPUT_TOKENS + OUTPUT_TOKENS + CACHED_TOKENS + REQUESTS
        TTS    → CHARACTERS + AUDIO_SECONDS + REQUESTS
        ASR    → AUDIO_SECONDS + REQUESTS
        MCP    → REQUESTS
    PricingRule:
      type: object
      additionalProperties: false
      required:
      - pricingRuleId
      - meter
      - unitSize
      - unitPrice
      - currency
      - effectiveFrom
      properties:
        pricingRuleId:
          $ref: '#/components/schemas/PricingRuleId'
        resourceId:
          type: string
        upstreamId:
          $ref: '#/components/schemas/UpstreamId'
        meter:
          $ref: '#/components/schemas/PricingMeter'
        unitSize:
          type: string
        unitPrice:
          type: string
        currency:
          type: string
        effectiveFrom:
          type: string
          format: date-time
    PricingSet:
      type: object
      additionalProperties: false
      required:
      - pricingRevision
      - rules
      properties:
        pricingRevision:
          type: integer
          minimum: 0
        rules:
          type: array
          items:
            $ref: '#/components/schemas/PricingRule'
    PutPricingRequest:
      type: object
      additionalProperties: false
      required:
      - expectedPricingRevision
      - rules
      properties:
        expectedPricingRevision:
          type: integer
          minimum: 0
        rules:
          type: array
          items:
            $ref: '#/components/schemas/PricingRule'
    SystemStatus:
      type: object
      additionalProperties: false
      required:
      - buildVersion
      - dbHealth
      - schemaIdentity
      - runtimeStatus
      - activeManagedGeneration
      - managedStateRevision
      - desiredControlRevision
      - relayReady
      - portalMode
      properties:
        publicOrigin:
          type: string
          format: uri
          description: Explicit public HTTP or HTTPS platform origin; absent when deployment configuration is incomplete.
        portalMode:
          type: string
          enum: [STANDARD, CUSTOM, UNAVAILABLE]
          description: Effective deployment-selected Portal document source. This is operational configuration, not Managed Snapshot content.
        portalUrl:
          type: string
          format: uri
          description: Device-facing Core /portal/ URL when Portal is available.
        portalUpstreamUrl:
          type: string
          format: uri
          description: Deployment-owned custom static Portal base URL proxied by Core; present only in CUSTOM mode.
        relayBuildVersion:
          type: string
          minLength: 1
          description: Running Relay build identity from a successful private status read. Omitted when unavailable; never copied from Hub.
        buildVersion:
          type: string
        dbHealth:
          type: string
        schemaIdentity:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        runtimeStatus:
          type: string
          enum:
          - READY
          - ACTIVATING
          - DEGRADED
        activeManagedGeneration:
          type: integer
          minimum: 0
        managedStateRevision:
          type: integer
          minimum: 0
        desiredControlRevision:
          type: integer
          minimum: 0
        desiredBundleHash:
          $ref: '#/components/schemas/Sha256Hash'
        relayReady:
          type: boolean
        appliedControlRevision:
          type: integer
          minimum: 0
        appliedBundleHash:
          $ref: '#/components/schemas/Sha256Hash'
        lastRelaySeenAt:
          type: string
          format: date-time
        currentActivation:
          $ref: '#/components/schemas/Activation'
        lastActivation:
          $ref: '#/components/schemas/Activation'
        spoolState:
          type: string
          enum: [OK, METERING_DEGRADED]
          description: Omitted when Relay spool status is unavailable; omission does not mean OK.
        spoolPendingCount:
          type: integer
          minimum: 0
        oldestPendingAgeSeconds:
          type: integer
          minimum: 0
        requestUsageIngestLagSeconds:
          type: integer
          minimum: 0
        semanticOrphanCount:
          type: integer
          minimum: 0
        semanticUnknownRequestCount:
          type: integer
          minimum: 0
          description: Number of retained requests with no linked semantic records or at least one UNKNOWN record. Counts requests once, excludes unlinked provider records, and uses the same completeness rule as Usage. Omission means unavailable, not zero.
    Health:
      type: object
      additionalProperties: false
      required:
      - live
      - ready
      properties:
        live:
          type: boolean
        ready:
          type: boolean
    EnterpriseUpdateStatus:
      type: string
      enum:
      - DRAFT
      - PUBLISHED
      - WITHDRAWN
    EnterpriseUpdateCategory:
      type: string
      enum:
      - ANNOUNCEMENT
      - MAINTENANCE
      - NOTICE
    EnterpriseUpdateSeverity:
      type: string
      enum:
      - INFO
      - WARNING
      - CRITICAL
    EnterpriseUpdateContentFormat:
      type: string
      enum:
      - MARKDOWN
      - PLAIN
    EnterpriseUpdate:
      type: object
      additionalProperties: false
      required:
      - enterpriseUpdateId
      - title
      - content
      - contentFormat
      - category
      - severity
      - status
      - feedRevision
      - createdAt
      - updatedAt
      properties:
        enterpriseUpdateId:
          $ref: '#/components/schemas/EnterpriseUpdateId'
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        contentFormat:
          $ref: '#/components/schemas/EnterpriseUpdateContentFormat'
        category:
          $ref: '#/components/schemas/EnterpriseUpdateCategory'
        severity:
          $ref: '#/components/schemas/EnterpriseUpdateSeverity'
        status:
          $ref: '#/components/schemas/EnterpriseUpdateStatus'
        publishedAt:
          type: string
          format: date-time
          nullable: true
        feedRevision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EnterpriseUpdatePage:
      type: object
      additionalProperties: false
      required:
      - items
      - feedRevision
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EnterpriseUpdate'
        feedRevision:
          type: integer
          minimum: 1
        nextCursor:
          type: string
    CreateEnterpriseUpdateRequest:
      type: object
      additionalProperties: false
      required:
      - title
      - content
      - contentFormat
      - category
      - severity
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        contentFormat:
          $ref: '#/components/schemas/EnterpriseUpdateContentFormat'
        category:
          $ref: '#/components/schemas/EnterpriseUpdateCategory'
        severity:
          $ref: '#/components/schemas/EnterpriseUpdateSeverity'
    UpdateEnterpriseUpdateRequest:
      type: object
      additionalProperties: false
      required:
      - title
      - content
      - contentFormat
      - category
      - severity
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        contentFormat:
          $ref: '#/components/schemas/EnterpriseUpdateContentFormat'
        category:
          $ref: '#/components/schemas/EnterpriseUpdateCategory'
        severity:
          $ref: '#/components/schemas/EnterpriseUpdateSeverity'
  responses:
    Problem:
      description: Problem response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
