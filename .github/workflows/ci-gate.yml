name: ci-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: 固定 pnpm 版本
        run: |
          corepack enable
          corepack prepare pnpm@11.0.0 --activate
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: 恢复 pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-${{ runner.os }}-node24-${{ hashFiles('console/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-node24-

      - uses: ariga/setup-atlas@v0
        with:
          version: 'v1.2.0'

      - name: 验证确定性生成链
        run: make generate

      - name: 执行 T0/T1/T2 聚合门禁
        run: make ci
