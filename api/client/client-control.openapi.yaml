openapi: 3.0.3
info:
  title: MEASIX Client Control API
  version: 1.0.0
paths:
  /.well-known/measix:
    get:
      operationId: discover
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discovery'
  /api/client/v1/enrollments/exchange:
    post:
      operationId: exchangeEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentExchangeRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentExchangeResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/client/v1/sessions/refresh:
    post:
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/client/v1/sessions/logout:
    post:
      operationId: logoutSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Logged out
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/client/v1/bootstrap:
    get:
      operationId: bootstrap
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bootstrap'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/client/v1/managed/state:
    get:
      operationId: getManagedState
      security:
      - bearerAuth: []
      parameters:
      - name: X-Measix-Applied-Managed-Generation
        in: header
        required: false
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedState'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/client/v1/managed/snapshots/{generation}:
    get:
      operationId: getManagedSnapshot
      security:
      - bearerAuth: []
      parameters:
      - name: generation
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Snapshot
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedSnapshot'
        '304':
          description: Not Modified
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
components:
  schemas:
    DeploymentId:
      type: string
      pattern: ^dep_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    UserId:
      type: string
      pattern: ^usr_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    DeviceId:
      type: string
      pattern: ^dev_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    EnrollmentId:
      type: string
      pattern: ^enr_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    SessionId:
      type: string
      pattern: ^ses_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    InstallationId:
      type: string
      pattern: ^ins_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    ProviderId:
      type: string
      pattern: ^prv_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    ModelId:
      type: string
      pattern: ^mdl_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    TtsId:
      type: string
      pattern: ^tts_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    AsrId:
      type: string
      pattern: ^asr_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    McpServerId:
      type: string
      pattern: ^mcp_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    PolicyId:
      type: string
      pattern: ^pol_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    DraftId:
      type: string
      pattern: ^drf_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    ReleaseId:
      type: string
      pattern: ^rel_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    UpstreamId:
      type: string
      pattern: ^ups_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    SecretId:
      type: string
      pattern: ^sec_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    RuntimeRouteId:
      type: string
      pattern: ^rte_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    ActivationId:
      type: string
      pattern: ^act_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    RequestId:
      type: string
      pattern: ^req_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    InteractionId:
      type: string
      pattern: ^int_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    PricingRuleId:
      type: string
      pattern: ^prc_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    IdempotencyKey:
      type: string
      pattern: ^idem_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    Sha256Hash:
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        detail:
          type: string
        requestId:
          $ref: '#/components/schemas/RequestId'
        activationId:
          $ref: '#/components/schemas/ActivationId'
        targetManagedGeneration:
          type: integer
          minimum: 0
        currentDraftRevision:
          type: integer
          minimum: 0
        forwarded:
          type: boolean
    ValidationIssue:
      type: object
      additionalProperties: false
      required:
      - code
      - severity
      - path
      - message
      properties:
        code:
          type: string
        severity:
          type: string
          enum:
          - ERROR
          - WARNING
        path:
          type: string
        message:
          type: string
    ProviderDefinition:
      type: object
      additionalProperties: false
      required:
      - providerId
      - displayName
      - clientProtocol
      - enabled
      properties:
        providerId:
          $ref: '#/components/schemas/ProviderId'
        displayName:
          type: string
          minLength: 1
        clientProtocol:
          type: string
          enum:
          - OPENAI_CHAT_COMPLETIONS
        enabled:
          type: boolean
    ModelDefinition:
      type: object
      additionalProperties: false
      required:
      - modelId
      - providerId
      - displayName
      - upstreamModelKey
      - runtimePath
      - inputModalities
      - outputModalities
      - capabilities
      - enabled
      properties:
        modelId:
          $ref: '#/components/schemas/ModelId'
        providerId:
          $ref: '#/components/schemas/ProviderId'
        displayName:
          type: string
        upstreamModelKey:
          type: string
        runtimePath:
          type: string
          pattern: ^/[^?#]*$
        inputModalities:
          type: array
          items:
            type: string
            enum:
            - TEXT
            - IMAGE
        outputModalities:
          type: array
          items:
            type: string
            enum:
            - TEXT
        capabilities:
          type: array
          items:
            type: string
            enum:
            - TOOL
            - REASONING
        enabled:
          type: boolean
    TtsDefinition:
      type: object
      additionalProperties: false
      required:
      - ttsId
      - displayName
      - clientProtocol
      - upstreamModelKey
      - runtimePath
      - voice
      - enabled
      properties:
        ttsId:
          $ref: '#/components/schemas/TtsId'
        displayName:
          type: string
        clientProtocol:
          type: string
          enum:
          - OPENAI_AUDIO_SPEECH
        upstreamModelKey:
          type: string
          minLength: 1
        voice:
          type: string
          minLength: 1
        runtimePath:
          type: string
          pattern: ^/[^?#]*$
        enabled:
          type: boolean
    AsrDefinition:
      type: object
      additionalProperties: false
      required:
      - asrId
      - displayName
      - clientProtocol
      - upstreamModelKey
      - runtimePath
      - enabled
      properties:
        asrId:
          $ref: '#/components/schemas/AsrId'
        displayName:
          type: string
        clientProtocol:
          type: string
          enum:
          - OPENAI_AUDIO_TRANSCRIPTIONS
        upstreamModelKey:
          type: string
          minLength: 1
        language:
          type: string
        runtimePath:
          type: string
          pattern: ^/[^?#]*$
        enabled:
          type: boolean
    McpDefinition:
      type: object
      additionalProperties: false
      required:
      - mcpServerId
      - displayName
      - clientProtocol
      - runtimePath
      - authOwnership
      - enabled
      properties:
        mcpServerId:
          $ref: '#/components/schemas/McpServerId'
        displayName:
          type: string
        clientProtocol:
          type: string
          enum:
          - MCP_STREAMABLE_HTTP
        runtimePath:
          type: string
          pattern: ^/[^?#]*$
        authOwnership:
          type: string
          enum:
          - ENTERPRISE_MANAGED
          - NONE
        enabled:
          type: boolean
    TimeoutPolicy:
      type: object
      additionalProperties: false
      required:
      - connectMs
      - responseHeaderMs
      - idleMs
      properties:
        connectMs:
          type: integer
          minimum: 1
        responseHeaderMs:
          type: integer
          minimum: 1
        idleMs:
          type: integer
          minimum: 1
        overallMs:
          type: integer
          minimum: 1
    RuntimeBindingDefinition:
      type: object
      additionalProperties: false
      required:
      - runtimeRouteId
      - resourceId
      - upstreamId
      - allowedMethods
      - allowedPathPrefixes
      - transportPolicy
      properties:
        runtimeRouteId:
          $ref: '#/components/schemas/RuntimeRouteId'
        resourceId:
          type: string
        upstreamId:
          $ref: '#/components/schemas/UpstreamId'
        allowedMethods:
          type: array
          minItems: 1
          items:
            type: string
        allowedPathPrefixes:
          type: array
          minItems: 1
          items:
            type: string
            pattern: ^/
        transportPolicy:
          type: string
          enum:
          - HTTP_REQUEST_RESPONSE
          - HTTP_STREAMING_SSE
          - HTTP_BINARY_STREAM
          - HTTP_MULTIPART
        timeoutPolicy:
          $ref: '#/components/schemas/TimeoutPolicy'
    ManagedPolicy:
      type: object
      additionalProperties: false
      required:
      - policyId
      - allowLocalProviders
      - allowLocalTts
      - allowLocalAsr
      - allowLocalMcp
      properties:
        policyId:
          $ref: '#/components/schemas/PolicyId'
        allowLocalProviders:
          type: boolean
        allowLocalTts:
          type: boolean
        allowLocalAsr:
          type: boolean
        allowLocalMcp:
          type: boolean
        defaultModelId:
          $ref: '#/components/schemas/ModelId'
        defaultTtsId:
          $ref: '#/components/schemas/TtsId'
        defaultAsrId:
          $ref: '#/components/schemas/AsrId'
    ManagedDraftContent:
      type: object
      additionalProperties: false
      required:
      - providers
      - models
      - tts
      - asr
      - mcp
      - bindings
      - policy
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderDefinition'
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelDefinition'
        tts:
          type: array
          items:
            $ref: '#/components/schemas/TtsDefinition'
        asr:
          type: array
          items:
            $ref: '#/components/schemas/AsrDefinition'
        mcp:
          type: array
          items:
            $ref: '#/components/schemas/McpDefinition'
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeBindingDefinition'
        policy:
          $ref: '#/components/schemas/ManagedPolicy'
    Discovery:
      type: object
      additionalProperties: false
      required:
      - product
      - protocolVersion
      - deploymentId
      - deploymentName
      - clientApiBase
      - runtimeApiBase
      - supportedSnapshotSchemaVersions
      properties:
        product:
          type: string
          enum:
          - MEASIX_AGENT_PLATFORM
        protocolVersion:
          type: string
          enum:
          - '1'
        deploymentId:
          $ref: '#/components/schemas/DeploymentId'
        deploymentName:
          type: string
        clientApiBase:
          type: string
          pattern: ^/
        runtimeApiBase:
          type: string
          pattern: ^/
        supportedSnapshotSchemaVersions:
          type: array
          items:
            type: integer
    EnrollmentExchangeRequest:
      type: object
      additionalProperties: false
      required:
      - code
      - installationId
      - deviceName
      - appVersion
      - platform
      properties:
        code:
          type: string
        installationId:
          $ref: '#/components/schemas/InstallationId'
        deviceName:
          type: string
        appVersion:
          type: string
        platform:
          type: string
          enum:
          - ANDROID
    EnrollmentExchangeResponse:
      type: object
      additionalProperties: false
      required:
      - deploymentId
      - userId
      - deviceId
      - sessionId
      - accessToken
      - accessTokenExpiresAt
      - refreshToken
      - refreshExpiresAt
      properties:
        deploymentId:
          $ref: '#/components/schemas/DeploymentId'
        userId:
          $ref: '#/components/schemas/UserId'
        deviceId:
          $ref: '#/components/schemas/DeviceId'
        sessionId:
          $ref: '#/components/schemas/SessionId'
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
          format: date-time
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
    RefreshResponse:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - accessTokenExpiresAt
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
    ManagedState:
      type: object
      additionalProperties: false
      required:
      - runtimeStatus
      - activeManagedGeneration
      - managedStateRevision
      - syncRequired
      - runtimeBlocked
      properties:
        runtimeStatus:
          type: string
          enum:
          - READY
          - ACTIVATING
          - DEGRADED
        activeManagedGeneration:
          type: integer
          minimum: 0
        managedStateRevision:
          type: integer
          minimum: 0
        syncRequired:
          type: boolean
        targetManagedGeneration:
          type: integer
          minimum: 1
        runtimeBlocked:
          type: boolean
    Bootstrap:
      type: object
      additionalProperties: false
      required:
      - deployment
      - user
      - device
      - session
      - supportedSnapshotSchemaVersions
      - managedState
      properties:
        deployment:
          type: object
          additionalProperties: false
          required:
          - deploymentId
          - name
          properties:
            deploymentId:
              $ref: '#/components/schemas/DeploymentId'
            name:
              type: string
        user:
          type: object
          additionalProperties: false
          required:
          - userId
          - displayName
          properties:
            userId:
              $ref: '#/components/schemas/UserId'
            displayName:
              type: string
        device:
          type: object
          additionalProperties: false
          required:
          - deviceId
          - status
          properties:
            deviceId:
              $ref: '#/components/schemas/DeviceId'
            status:
              type: string
              enum:
              - ACTIVE
              - REVOKED
        session:
          type: object
          additionalProperties: false
          required:
          - sessionId
          - expiresAt
          properties:
            sessionId:
              $ref: '#/components/schemas/SessionId'
            expiresAt:
              type: string
              format: date-time
        supportedSnapshotSchemaVersions:
          type: array
          items:
            type: integer
        managedState:
          $ref: '#/components/schemas/ManagedState'
    ManagedSnapshot:
      type: object
      additionalProperties: false
      required:
      - deploymentId
      - schemaVersion
      - managedGeneration
      - releaseId
      - snapshotHash
      - providers
      - models
      - tts
      - asr
      - mcp
      - policy
      - metadata
      properties:
        deploymentId:
          $ref: '#/components/schemas/DeploymentId'
        schemaVersion:
          type: integer
          enum:
          - 1
        managedGeneration:
          type: integer
          minimum: 1
        releaseId:
          $ref: '#/components/schemas/ReleaseId'
        snapshotHash:
          $ref: '#/components/schemas/Sha256Hash'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderDefinition'
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelDefinition'
        tts:
          type: array
          items:
            $ref: '#/components/schemas/TtsDefinition'
        asr:
          type: array
          items:
            $ref: '#/components/schemas/AsrDefinition'
        mcp:
          type: array
          items:
            $ref: '#/components/schemas/McpDefinition'
        policy:
          $ref: '#/components/schemas/ManagedPolicy'
        metadata:
          type: object
          additionalProperties: false
          required:
          - publishedAt
          properties:
            publishedAt:
              type: string
              format: date-time
            publishedByUserId:
              $ref: '#/components/schemas/UserId'
  responses:
    Problem:
      description: Problem response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
